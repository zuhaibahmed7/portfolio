# Netlify equivalent of vercel.json — security headers + CSP for the SPA.
# (Only needed if you deploy to Netlify instead of Vercel.)

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com https://plausible.io; frame-src https://huggingface.co https://*.hf.space https://www.youtube-nocookie.com https://www.youtube.com https://youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# SPA fallback: all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
