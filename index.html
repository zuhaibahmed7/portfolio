    <script>
      // Floating preview switcher — only mounts when a preview theme is active.
      (function () {
        try {
          var names = {
            '': 'Original',
            minimal: 'A · Minimal',
            terminal: 'B · Terminal',
            editorial: 'C · Editorial',
          };
          var current = document.documentElement.dataset.theme || '';
          if (!(current in names)) return;
          var bar = document.createElement('div');
          bar.style.cssText =
            'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;gap:6px;padding:6px;border-radius:12px;background:rgba(15,15,20,0.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);box-shadow:0 10px 30px rgba(0,0,0,0.35);font:500 12px/1 Inter,system-ui,sans-serif;';
          var set = function (key) {
            if (!key) {
              document.documentElement.removeAttribute('data-theme');
              var u = new URL(location.href);
              u.searchParams.delete('theme');
              history.replaceState(null, '', u);
            } else {
              document.documentElement.dataset.theme = key;
              var u2 = new URL(location.href);
              u2.searchParams.set('theme', key);
              history.replaceState(null, '', u2);
            }
            build();
          };
          var build = function () {
            bar.textContent = '';
            Object.keys(names).forEach(function (key) {
              var isActive = (document.documentElement.dataset.theme || '') === key;
              var btn = document.createElement('button');
              btn.textContent = names[key];
              btn.style.cssText =
                'border:1px solid ' + (isActive ? 'rgba(167,139,250,0.9)' : 'rgba(255,255,255,0.12)') +
                ';background:' + (isActive ? 'rgba(167,139,250,0.18)' : 'transparent') +
                ';color:' + (isActive ? '#c4b5fd' : '#9ca3af') +
                ';padding:7px 12px;border-radius:8px;cursor:pointer;transition:all .15s;';
              btn.addEventListener('click', function () { set(key); });
              bar.appendChild(btn);
            });
          };
          document.addEventListener('DOMContentLoaded', function () {
            document.body.appendChild(bar);
            build();
          });
        } catch (e) {}
      })();
    </script>
